[project]
name = "will-inheritance"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "laksumi213", email = "laksumi.fb@gmail.com" }
]
dependencies = [
    "selenium>=4.24.0",
    "flet[all]>=0.28.3",
    "pandas>=2.3.2",
    "pypdf>=4.3.1",
    "reportlab>=4.2.2",
    "pdfminer>=20191125",
    "pyautogui>=0.9.54",
    "jaconv>=0.4.0",
    "mojimoji>=0.0.13",
    "zengin-code>=1.1.0.20250825",
    "bs4>=0.0.2",
    "pypdf2>=3.0.1",
    "pandas-datareader>=0.10.0",
    "setuptools>=65",
    "xlwings>=0.32.2",
    "pdf2image>=1.17.0",
    "ruff>=0.12.10",
    "openpyxl>=3.1.5",
    "pyinstaller>=6.15.0",
    "sqlalchemy>=2.0.43",
    "webdriver-manager>=4.0.2",
    "requests>=2.32.5",
    "pyperclip>=1.11.0",
    "numpy>=2.3.2",
    "python-dotenv>=1.2.1",
    "keyboard>=0.13.5",
    "matplotlib>=3.10.7",
    "google-generativeai>=0.8.5",
    "pymupdf>=1.26.6",
    "pillow==10.4.0",
    "google-cloud-aiplatform>=1.129.0",
    "pymupdf>=1.26.6",
    "google-generativeai>=0.8.5",
    "python-docx>=1.2.0",
]
readme = "README.md"
requires-python = ">= 3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/will_inheritance"]

[tool.flake8]
ignore = ["E501", "W503", "E203"]
# E501を無視するように指定
# ignore = ["E501"]

[tool.ruff]
# ignore = ["E501"]
# Ruffの最大行長を100文字に設定する
line-length = 100
select = ["E", "F", "I"]
